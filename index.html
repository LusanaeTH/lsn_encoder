<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSN-ENCODER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: #0d1117;
            color: #e2e8f0;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        :root {
            --breeze-bg: rgba(49, 54, 59, 0.65);
            --breeze-border: rgba(255, 255, 255, 0.08);
            --plasma-accent: #3daee9;
            --plasma-purple: #9b59b6;
        }

        #sky {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: linear-gradient(to bottom, #020111 0%, #150935 50%, #00001a 100%);
        }

        .moon {
            position: fixed;
            top: 5%;
            right: 5%;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            box-shadow: 15px 15px 0 0 #f6f1d3, 0 0 40px 10px rgba(246, 241, 211, 0.15);
            transform: rotate(-45deg);
            z-index: -1;
            animation: moonFloat 20s ease-in-out infinite alternate;
        }

        @keyframes moonFloat {
            0% { transform: translateY(0) rotate(-45deg); }
            100% { transform: translateY(-20px) rotate(-35deg); }
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite alternate ease-in-out;
            opacity: 0;
        }

        @keyframes twinkle {
            0% { opacity: 0.05; transform: scale(0.8); }
            100% { opacity: 0.8; transform: scale(1.2); box-shadow: 0 0 4px white; }
        }

        .plasma-card {
            background: var(--breeze-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--breeze-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .plasma-input {
            background: rgba(20, 24, 28, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
            color: white;
        }
        .plasma-input:focus {
            outline: none;
            border-color: var(--plasma-accent);
            box-shadow: 0 0 0 2px rgba(61, 174, 233, 0.2);
        }
        .plasma-input[readonly] {
            background: rgba(255, 255, 255, 0.05);
            border-color: transparent;
            cursor: not-allowed;
            color: #94a3b8;
        }

        input[type="file"] { display: none; }
        
        .file-drop-area {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }
        .file-drop-area:hover, .file-drop-area.dragover {
            border-color: var(--plasma-accent);
            background: rgba(61, 174, 233, 0.05);
        }

        .btn-action {
            background: linear-gradient(135deg, var(--plasma-accent), #2980b9);
            transition: all 0.2s ease;
        }
        .btn-action:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }
        .btn-action:active:not(:disabled) { transform: translateY(1px); }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-decode { background: linear-gradient(135deg, var(--plasma-purple), #8e44ad); }

        .tab-btn { color: #64748b; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab-btn.active { color: white; border-bottom-color: var(--plasma-accent); }

        .radio-custom:checked + div {
            border-color: var(--plasma-accent);
            background: rgba(61, 174, 233, 0.1);
        }
        .radio-custom:checked + div span { color: white; }

        /* Filename Input with Locked Extension */
        .filename-wrapper {
            display: flex;
            align-items: stretch;
            background: rgba(20, 24, 28, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            overflow: hidden;
            transition: all 0.2s ease;
        }
        .filename-wrapper:focus-within {
            border-color: var(--plasma-accent);
            box-shadow: 0 0 0 2px rgba(61, 174, 233, 0.2);
        }
        .filename-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            padding: 0.75rem 1rem;
            color: white;
            font-size: 0.875rem;
            outline: none;
        }
        .filename-ext {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.75rem 1rem;
            color: #94a3b8;
            font-size: 0.875rem;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            user-select: none;
        }

        /* Table Styles */
        .table-container {
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            background: rgba(0, 0, 0, 0.3);
            max-height: 50vh;
            overflow-y: auto;
        }
        .secret-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        .secret-table th, .secret-table td {
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem;
            min-width: 120px;
        }
        .secret-table th { background: rgba(255, 255, 255, 0.05); font-weight: 600; text-align: center;}
        .cell-input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            padding: 0.25rem;
            font-size: 0.875rem;
        }
        .cell-input:focus { background: rgba(61, 174, 233, 0.1); }
        .cell-input[readonly] { color: #cbd5e1; }
        
        .table-ctrl-btn {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 0.25rem;
            padding: 0.2rem 0.4rem;
            font-size: 0.75rem;
            color: #cbd5e1;
            transition: all 0.2s;
            cursor: pointer;
        }
        .table-ctrl-btn:hover { background: var(--plasma-accent); color: white; }
        .table-ctrl-btn.danger:hover { background: #e74c3c; }

        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: white;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-success { background: rgba(39, 174, 96, 0.85); border: 1px solid #2ecc71; }
        .toast-error { background: rgba(192, 57, 43, 0.85); border: 1px solid #e74c3c; }
        .toast-info { background: rgba(41, 128, 185, 0.85); border: 1px solid #3498db; }

        #processingCanvas { display: none; }
    </style>
</head>
<body>

    <div id="sky"></div>
    <div class="moon"></div>
    <canvas id="processingCanvas"></canvas>
    <div id="toast-container"></div>

    <div id="mainCard" class="w-full max-w-md plasma-card rounded-2xl p-6 sm:p-8 relative z-10 transition-all duration-300">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-wider text-white">LSN-ENCODER</h1>
        </div>

        <div class="flex justify-center gap-6 mb-6">
            <button id="tabEncode" class="tab-btn active uppercase tracking-wider text-sm font-semibold pb-1">Encode</button>
            <button id="tabDecode" class="tab-btn uppercase tracking-wider text-sm font-semibold pb-1">Decode</button>
        </div>

        <!-- ENCODE VIEW -->
        <div id="viewEncode" class="flex flex-col gap-5">
            
            <!-- Type Toggle (File vs Table) -->
            <div class="flex justify-center bg-black/20 p-1 rounded-lg border border-white/10">
                <button id="modeFileBtn" class="flex-1 py-1.5 text-sm font-medium rounded text-white bg-white/10 shadow shadow-black/20 transition-all">File</button>
                <button id="modeTableBtn" class="flex-1 py-1.5 text-sm font-medium rounded text-gray-400 hover:text-white transition-all">Table Tool</button>
            </div>

            <!-- File Input Area -->
            <div id="encFileArea">
                <input type="file" id="encSecretFile">
                <label for="encSecretFile" id="encSecretZone" class="file-drop-area flex flex-col items-center justify-center w-full h-24 rounded-lg cursor-pointer">
                    <svg class="w-6 h-6 text-gray-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <span id="encSecretName" class="text-gray-400 text-xs px-4 text-center truncate w-full">Select file to encrypt</span>
                </label>
            </div>

            <!-- Table Editor Area (Hidden by default) -->
            <div id="encTableArea" class="hidden flex-col gap-3">
                <div class="flex flex-wrap gap-2 justify-between items-center">
                    <div class="flex gap-2">
                        <input type="file" id="csvImport" accept=".csv">
                        <label for="csvImport" class="text-xs bg-white/10 hover:bg-white/20 text-white py-1.5 px-3 rounded cursor-pointer border border-white/10 transition-colors">Import CSV</label>
                        <button id="addColBtn" class="text-xs bg-white/10 hover:bg-white/20 text-white py-1.5 px-3 rounded border border-white/10 transition-colors">+ Col</button>
                        <button id="addRowBtn" class="text-xs bg-white/10 hover:bg-white/20 text-white py-1.5 px-3 rounded border border-white/10 transition-colors">+ Row</button>
                    </div>
                    <input type="text" id="tableSearch" placeholder="Search..." class="text-xs plasma-input py-1.5 px-3 rounded w-32 focus:w-48 transition-all">
                </div>
                <div class="table-container" id="tableContainer">
                    <!-- Table rendered here -->
                </div>
            </div>

            <!-- Output Filename -->
            <div class="filename-wrapper">
                <input type="text" id="outFilename" placeholder="Output filename (optional)" class="filename-input">
                <span id="outExt" class="filename-ext">.lsn</span>
            </div>

            <!-- Output Mode Selection -->
            <div class="grid grid-cols-2 gap-3">
                <label class="cursor-pointer relative">
                    <input type="radio" name="outputMode" value="lsn" class="peer sr-only radio-custom" checked>
                    <div class="rounded-lg border border-gray-600/50 p-3 text-center transition-all">
                        <span class="text-xs font-semibold text-gray-400 uppercase">.lsn File</span>
                    </div>
                </label>
                <label class="cursor-pointer relative">
                    <input type="radio" name="outputMode" value="image" class="peer sr-only radio-custom">
                    <div class="rounded-lg border border-gray-600/50 p-3 text-center transition-all">
                        <span class="text-xs font-semibold text-gray-400 uppercase">Image Stego</span>
                    </div>
                </label>
            </div>

            <div id="carrierImageWrapper" class="hidden">
                <input type="file" id="encCarrierFile" accept="image/png, image/jpeg">
                <label for="encCarrierFile" id="encCarrierZone" class="file-drop-area flex flex-col items-center justify-center w-full h-20 rounded-lg cursor-pointer">
                    <svg class="w-5 h-5 text-gray-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span id="encCarrierName" class="text-gray-400 text-xs px-4 text-center truncate w-full">Select carrier image</span>
                </label>
            </div>

            <input type="password" id="encPassword" placeholder="Password" class="w-full px-4 py-3 rounded-lg plasma-input text-white text-sm">
            <button id="btnEncode" class="btn-action w-full py-3 rounded-lg text-white font-bold uppercase tracking-wider text-sm">Encode</button>
        </div>

        <!-- DECODE VIEW -->
        <div id="viewDecode" class="hidden flex-col gap-5">
            <div id="decInputArea" class="flex flex-col gap-5">
                <div>
                    <input type="file" id="decFile" accept=".lsn, image/png">
                    <label for="decFile" id="decFileZone" class="file-drop-area flex flex-col items-center justify-center w-full h-24 rounded-lg cursor-pointer">
                        <svg class="w-6 h-6 text-gray-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path></svg>
                        <span id="decFileName" class="text-gray-400 text-xs px-4 text-center truncate w-full">Select .lsn or stego image</span>
                    </label>
                </div>
                <input type="password" id="decPassword" placeholder="Password" class="w-full px-4 py-3 rounded-lg plasma-input text-white text-sm">
                <button id="btnDecode" class="btn-action btn-decode w-full py-3 rounded-lg text-white font-bold uppercase tracking-wider text-sm">Decode</button>
            </div>

            <!-- Decoded Table View (Hidden until a table is decoded) -->
            <div id="decTableArea" class="hidden flex-col gap-4">
                <div class="flex justify-between items-center bg-blue-900/30 p-3 rounded-lg border border-blue-500/30">
                    <div>
                        <span class="text-xs text-blue-300 font-bold uppercase block">Secured Data Loaded</span>
                        <span id="decTableFilename" class="text-sm text-white truncate max-w-[200px] block">filename.lsn</span>
                    </div>
                    <div class="flex gap-2">
                        <button id="btnToggleEdit" class="text-xs bg-white/10 hover:bg-white/20 text-white py-1.5 px-3 rounded border border-white/10 transition-colors">Enable Edit</button>
                        <button id="btnCloseDecTable" class="text-xs bg-red-500/20 hover:bg-red-500/40 text-red-200 py-1.5 px-3 rounded border border-red-500/30 transition-colors">Close</button>
                    </div>
                </div>
                
                <!-- Re-use the table renderer here -->
                <div class="table-container" id="decTableContainer"></div>

                <div id="decTableReEncodeArea" class="hidden flex-col gap-3 mt-2 border-t border-white/10 pt-4">
                    <span class="text-xs text-gray-400 uppercase font-semibold">Re-Encrypt Changes</span>
                    <input type="password" id="reEncPassword" placeholder="New or Same Password" class="w-full px-3 py-2 rounded-lg plasma-input text-sm">
                    <button id="btnReEncode" class="btn-action w-full py-2 rounded-lg text-white font-bold uppercase tracking-wider text-sm">Save & Encode</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- UI & Environment Setup ---
        const sky = document.getElementById('sky');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2 + 0.5;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}vw`;
            star.style.top = `${Math.random() * 100}vh`;
            star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
            star.style.animationDelay = `${Math.random() * 5}s`;
            sky.appendChild(star);
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            void toast.offsetWidth; 
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        const mainCard = document.getElementById('mainCard');
        const tabs = {
            enc: document.getElementById('tabEncode'),
            dec: document.getElementById('tabDecode'),
            viewEnc: document.getElementById('viewEncode'),
            viewDec: document.getElementById('viewDecode')
        };

        function resetDecodeView() {
            document.getElementById('decInputArea').classList.remove('hidden');
            document.getElementById('decInputArea').classList.add('flex');
            document.getElementById('decTableArea').classList.add('hidden');
            document.getElementById('decTableArea').classList.remove('flex');
            document.getElementById('decPassword').value = '';
            mainCard.classList.remove('max-w-4xl');
            mainCard.classList.add('max-w-md');
        }

        tabs.enc.addEventListener('click', () => {
            tabs.enc.classList.add('active'); tabs.dec.classList.remove('active');
            tabs.viewEnc.classList.remove('hidden'); tabs.viewEnc.classList.add('flex');
            tabs.viewDec.classList.add('hidden'); tabs.viewDec.classList.remove('flex');
            updateCardWidth(encodeMode === 'table');
        });
        tabs.dec.addEventListener('click', () => {
            tabs.dec.classList.add('active'); tabs.enc.classList.remove('active');
            tabs.viewDec.classList.remove('hidden'); tabs.viewDec.classList.add('flex');
            tabs.viewEnc.classList.add('hidden'); tabs.viewEnc.classList.remove('flex');
            updateCardWidth(document.getElementById('decTableArea').classList.contains('flex'));
        });

        function updateCardWidth(isWide) {
            if (isWide) {
                mainCard.classList.remove('max-w-md');
                mainCard.classList.add('max-w-4xl');
            } else {
                mainCard.classList.remove('max-w-4xl');
                mainCard.classList.add('max-w-md');
            }
        }

        // --- Encode Mode Toggle (File / Table) ---
        let encodeMode = 'file'; // 'file' or 'table'
        const modeFileBtn = document.getElementById('modeFileBtn');
        const modeTableBtn = document.getElementById('modeTableBtn');
        const encFileArea = document.getElementById('encFileArea');
        const encTableArea = document.getElementById('encTableArea');
        const outFilename = document.getElementById('outFilename');

        function setEncodeMode(mode) {
            encodeMode = mode;
            if (mode === 'file') {
                modeFileBtn.className = 'flex-1 py-1.5 text-sm font-medium rounded text-white bg-white/10 shadow shadow-black/20 transition-all';
                modeTableBtn.className = 'flex-1 py-1.5 text-sm font-medium rounded text-gray-400 hover:text-white transition-all';
                encFileArea.classList.remove('hidden');
                encTableArea.classList.add('hidden');
                encTableArea.classList.remove('flex');
                outFilename.placeholder = "Output filename (optional)";
                updateCardWidth(false);
            } else {
                modeTableBtn.className = 'flex-1 py-1.5 text-sm font-medium rounded text-white bg-white/10 shadow shadow-black/20 transition-all';
                modeFileBtn.className = 'flex-1 py-1.5 text-sm font-medium rounded text-gray-400 hover:text-white transition-all';
                encFileArea.classList.add('hidden');
                encTableArea.classList.remove('hidden');
                encTableArea.classList.add('flex');
                outFilename.placeholder = "Enter table name...";
                if(!outFilename.value) outFilename.value = "secret_table";
                updateCardWidth(true);
                renderTable(tableData, 'tableContainer', 'edit');
            }
        }

        modeFileBtn.addEventListener('click', () => setEncodeMode('file'));
        modeTableBtn.addEventListener('click', () => setEncodeMode('table'));

        // --- Radio Output & Extension Preview ---
        const radios = document.querySelectorAll('input[name="outputMode"]');
        const carrierWrapper = document.getElementById('carrierImageWrapper');
        const outExt = document.getElementById('outExt');
        
        radios.forEach(r => {
            r.addEventListener('change', (e) => {
                if (e.target.value === 'image') {
                    carrierWrapper.classList.remove('hidden');
                    outExt.textContent = '.png';
                } else {
                    carrierWrapper.classList.add('hidden');
                    outExt.textContent = '.lsn';
                }
            });
        });

        // --- File Inputs Handling ---
        const filesData = { encSecret: null, encCarrier: null, decFile: null };
        function bindFileInput(inputId, nameDisplayId, stateKey, onChangeCallback) {
            const input = document.getElementById(inputId);
            const display = document.getElementById(nameDisplayId);
            const zone = display.parentElement;

            input.addEventListener('change', (e) => {
                if (e.target.files[0]) {
                    filesData[stateKey] = e.target.files[0];
                    display.textContent = e.target.files[0].name;
                    display.classList.add('text-white');
                    if(onChangeCallback) onChangeCallback(e.target.files[0]);
                }
            });

            zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
            zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('dragover');
                if (e.dataTransfer.files[0]) {
                    input.files = e.dataTransfer.files;
                    input.dispatchEvent(new Event('change'));
                }
            });
        }

        bindFileInput('encSecretFile', 'encSecretName', 'encSecret', (file) => {
            if(!outFilename.value && encodeMode === 'file') {
                const parts = file.name.split('.');
                parts.pop(); // remove original ext
                outFilename.value = parts.join('.') || file.name;
            }
        });
        bindFileInput('encCarrierFile', 'encCarrierName', 'encCarrier');
        bindFileInput('decFile', 'decFileName', 'decFile');

        // --- Table Editor Logic ---
        let tableData = [["", ""]];
        
        function parseCSV(text) {
            const rows = [];
            let currRow = [], currCell = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) { currRow.push(currCell.trim()); currCell = ''; }
                else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && text[i+1] === '\n') i++; // skip \n
                    currRow.push(currCell.trim());
                    if (currRow.some(c => c !== '')) rows.push(currRow);
                    currRow = []; currCell = '';
                }
                else currCell += char;
            }
            if (currCell || currRow.length) { currRow.push(currCell.trim()); rows.push(currRow); }
            // Normalize columns
            const maxCols = Math.max(...rows.map(r => r.length));
            return rows.map(r => {
                while(r.length < maxCols) r.push("");
                return r;
            });
        }

        document.getElementById('csvImport').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const parsed = parseCSV(event.target.result);
                    if(parsed.length > 0) tableData = parsed;
                    renderTable(tableData, 'tableContainer', 'edit');
                    showToast("CSV Imported", "success");
                } catch(err) { showToast("Error parsing CSV", "error"); }
            };
            reader.readAsText(file);
            e.target.value = ''; // reset
        });

        // Search logic
        let currentSearchTerm = '';
        document.getElementById('tableSearch').addEventListener('input', (e) => {
            currentSearchTerm = e.target.value.toLowerCase();
            renderTable(tableData, 'tableContainer', 'edit');
        });

        function renderTable(data, containerId, mode = 'readonly') {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if(!data || data.length === 0) return;

            const table = document.createElement('table');
            table.className = 'secret-table';

            const numCols = data[0].length;
            
            // Render Headers (Controls)
            if (mode === 'edit') {
                const trHead = document.createElement('tr');
                const thEmpty = document.createElement('th');
                thEmpty.style.width = '50px';
                trHead.appendChild(thEmpty); // for row controls

                for (let j = 0; j < numCols; j++) {
                    const th = document.createElement('th');
                    th.innerHTML = `
                        <div class="flex gap-1 justify-center">
                            <button class="table-ctrl-btn" onclick="moveCol(${j}, -1)" ${j===0?'disabled':''}>&lt;</button>
                            <button class="table-ctrl-btn danger" onclick="delCol(${j})">X</button>
                            <button class="table-ctrl-btn" onclick="moveCol(${j}, 1)" ${j===numCols-1?'disabled':''}>&gt;</button>
                        </div>
                    `;
                    trHead.appendChild(th);
                }
                table.appendChild(trHead);
            }

            // Render Rows
            data.forEach((row, i) => {
                // Search filter
                if (currentSearchTerm && !row.some(cell => cell.toLowerCase().includes(currentSearchTerm))) {
                    return; // skip rendering
                }

                const tr = document.createElement('tr');
                
                if (mode === 'edit') {
                    const tdCtrl = document.createElement('td');
                    tdCtrl.innerHTML = `
                        <div class="flex gap-1 justify-center flex-col sm:flex-row">
                            <button class="table-ctrl-btn" onclick="moveRow(${i}, -1)" ${i===0?'disabled':''}>&uarr;</button>
                            <button class="table-ctrl-btn danger" onclick="delRow(${i})">X</button>
                            <button class="table-ctrl-btn" onclick="moveRow(${i}, 1)" ${i===data.length-1?'disabled':''}>&darr;</button>
                        </div>
                    `;
                    tr.appendChild(tdCtrl);
                }

                row.forEach((cell, j) => {
                    const td = document.createElement('td');
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'cell-input';
                    input.value = cell;
                    if (mode === 'readonly') input.readOnly = true;
                    else {
                        input.addEventListener('input', (e) => { data[i][j] = e.target.value; });
                    }
                    td.appendChild(input);
                    tr.appendChild(td);
                });
                table.appendChild(tr);
            });

            container.appendChild(table);
        }

        // Global functions for inline HTML event handlers
        window.addCol = () => { tableData.forEach(r => r.push("")); renderTable(tableData, 'tableContainer', 'edit'); };
        window.addRow = () => { tableData.push(new Array(tableData[0].length).fill("")); renderTable(tableData, 'tableContainer', 'edit'); };
        window.delCol = (j) => { if(tableData[0].length > 1) { tableData.forEach(r => r.splice(j, 1)); renderTable(tableData, 'tableContainer', 'edit'); } };
        window.delRow = (i) => { if(tableData.length > 1) { tableData.splice(i, 1); renderTable(tableData, 'tableContainer', 'edit'); } };
        window.moveCol = (j, dir) => {
            if(j + dir >= 0 && j + dir < tableData[0].length) {
                tableData.forEach(r => { const temp = r[j]; r[j] = r[j+dir]; r[j+dir] = temp; });
                renderTable(tableData, 'tableContainer', 'edit');
            }
        };
        window.moveRow = (i, dir) => {
            if(i + dir >= 0 && i + dir < tableData.length) {
                const temp = tableData[i]; tableData[i] = tableData[i+dir]; tableData[i+dir] = temp;
                renderTable(tableData, 'tableContainer', 'edit');
            }
        };

        document.getElementById('addColBtn').addEventListener('click', window.addCol);
        document.getElementById('addRowBtn').addEventListener('click', window.addRow);

        // --- Core Cryptography Engine ---
        async function getBaseKey(password) {
            return window.crypto.subtle.importKey(
                "raw", new TextEncoder().encode(password),
                { name: "PBKDF2" }, false, ["deriveKey"]
            );
        }

        async function deriveAesKey(baseKey, salt) {
            return window.crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
                baseKey, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
            );
        }

        // Payload Format: [Salt1 16] [Salt2 16] [IV1 12] [IV2 12] [Type 1] [NameLen 1] [Name N] [Cipher N]
        // Type: 0 = File, 1 = Table JSON
        async function multiEncryptPayload(fileBuffer, fileName, password, payloadType = 0) {
            const baseKey = await getBaseKey(password);
            
            const salt1 = crypto.getRandomValues(new Uint8Array(16));
            const iv1 = crypto.getRandomValues(new Uint8Array(12));
            const key1 = await deriveAesKey(baseKey, salt1);
            
            const salt2 = crypto.getRandomValues(new Uint8Array(16));
            const iv2 = crypto.getRandomValues(new Uint8Array(12));
            const key2 = await deriveAesKey(baseKey, salt2);

            const cipher1 = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv1 }, key1, fileBuffer);
            const cipher2 = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv2 }, key2, cipher1);

            let safeName = fileName.slice(0, 250); // prevent overflow
            const nameBytes = new TextEncoder().encode(safeName);
            const cipherArray = new Uint8Array(cipher2);

            const totalLen = 16 + 16 + 12 + 12 + 1 + 1 + nameBytes.length + cipherArray.length;
            const payload = new Uint8Array(totalLen);
            
            let offset = 0;
            payload.set(salt1, offset); offset += 16;
            payload.set(salt2, offset); offset += 16;
            payload.set(iv1, offset); offset += 12;
            payload.set(iv2, offset); offset += 12;
            payload.set([payloadType], offset); offset += 1;
            payload.set([nameBytes.length], offset); offset += 1;
            payload.set(nameBytes, offset); offset += nameBytes.length;
            payload.set(cipherArray, offset);

            return payload;
        }

        async function multiDecryptPayload(payload, password) {
            let offset = 0;
            const salt1 = payload.slice(offset, offset + 16); offset += 16;
            const salt2 = payload.slice(offset, offset + 16); offset += 16;
            const iv1 = payload.slice(offset, offset + 12); offset += 12;
            const iv2 = payload.slice(offset, offset + 12); offset += 12;

            const payloadType = payload[offset]; offset += 1;
            const nameLen = payload[offset]; offset += 1;
            const nameBytes = payload.slice(offset, offset + nameLen); offset += nameLen;
            const fileName = new TextDecoder().decode(nameBytes);

            const cipher2 = payload.slice(offset);

            const baseKey = await getBaseKey(password);
            const key1 = await deriveAesKey(baseKey, salt1);
            const key2 = await deriveAesKey(baseKey, salt2);

            let cipher1;
            try { cipher1 = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv2 }, key2, cipher2); } 
            catch { throw new Error("Incorrect password or corrupted data (L2)."); }

            let originalBuffer;
            try { originalBuffer = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv1 }, key1, cipher1); } 
            catch { throw new Error("Decryption failed at layer 1."); }

            return { buffer: originalBuffer, fileName, type: payloadType };
        }

        // --- Steganography Engine ---
        function getBit(byte, bitIndex) { return (byte >> (7 - bitIndex)) & 1; }

        async function embedDataInImage(imageFile, payloadBytes) {
            const imgUrl = URL.createObjectURL(imageFile);
            const img = new Image();
            await new Promise((resolve, reject) => { 
                img.onload = resolve; 
                img.onerror = reject;
                img.src = imgUrl; 
            });

            const canvas = document.getElementById('processingCanvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            const lengthBuffer = new ArrayBuffer(4);
            new DataView(lengthBuffer).setUint32(0, payloadBytes.length, false);
            const stegoData = new Uint8Array(4 + payloadBytes.length);
            stegoData.set(new Uint8Array(lengthBuffer), 0);
            stegoData.set(payloadBytes, 4);

            const totalBits = stegoData.length * 8;
            const requiredPixels = Math.ceil(totalBits / 3);
            let currentPixels = img.width * img.height;
            let tw = img.width, th = img.height;

            if (requiredPixels > currentPixels) {
                const scale = Math.sqrt(requiredPixels / currentPixels);
                tw = Math.ceil(img.width * scale * 1.05);
                th = Math.ceil(img.height * scale * 1.05);
            }

            canvas.width = tw; canvas.height = th;
            ctx.drawImage(img, 0, 0, tw, th);
            const imageData = ctx.getImageData(0, 0, tw, th);
            const pixels = imageData.data;

            let bitIndex = 0;
            for (let i = 0; i < pixels.length && bitIndex < totalBits; i += 4) {
                for(let c = 0; c < 3; c++) {
                    if (bitIndex < totalBits) {
                        const byteVal = stegoData[Math.floor(bitIndex / 8)];
                        pixels[i + c] = (pixels[i + c] & 0xFE) | getBit(byteVal, bitIndex % 8);
                        bitIndex++;
                    }
                }
                pixels[i + 3] = 255; 
            }

            ctx.putImageData(imageData, 0, 0);
            URL.revokeObjectURL(imgUrl);
            return canvas.toDataURL("image/png");
        }

        async function extractDataFromImage(imageFile) {
            const imgUrl = URL.createObjectURL(imageFile);
            const img = new Image();
            await new Promise((resolve, reject) => { 
                img.onload = resolve; 
                img.onerror = reject;
                img.src = imgUrl; 
            });

            const canvas = document.getElementById('processingCanvas');
            canvas.width = img.width; canvas.height = img.height;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(img, 0, 0);

            const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            
            let extracted = [];
            let bitAcc = 0;
            let bitCount = 0;
            let payloadLen = 0;
            let readingLen = true;

            for (let i = 0; i < pixels.length; i += 4) {
                for (let c = 0; c < 3; c++) {
                    bitAcc = (bitAcc << 1) | (pixels[i + c] & 1);
                    bitCount++;
                    
                    if (bitCount === 8) {
                        extracted.push(bitAcc);
                        bitAcc = 0; bitCount = 0;

                        if (readingLen && extracted.length === 4) {
                            payloadLen = new DataView(new Uint8Array(extracted).buffer).getUint32(0, false);
                            if (payloadLen === 0 || payloadLen > (pixels.length / 4 * 3)) {
                                throw new Error("Invalid stego format or image does not contain encoded data.");
                            }
                            extracted = [];
                            readingLen = false;
                        } else if (!readingLen && extracted.length === payloadLen) {
                            URL.revokeObjectURL(imgUrl);
                            return new Uint8Array(extracted);
                        }
                    }
                }
            }
            URL.revokeObjectURL(imgUrl);
            throw new Error("Could not find complete payload in image.");
        }

        function downloadFile(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click();
            setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
        }

        // --- Main Action Buttons ---

        document.getElementById('btnEncode').addEventListener('click', async () => {
            const pass = document.getElementById('encPassword').value;
            const mode = document.querySelector('input[name="outputMode"]:checked').value;
            const carrier = filesData.encCarrier;
            
            let buffer, fName, pType;

            if (encodeMode === 'file') {
                const secret = filesData.encSecret;
                if (!secret) return showToast("Please select a file to encrypt.", "error");
                fName = outFilename.value.trim() || secret.name.split('.')[0] || "encrypted_file";
                buffer = await secret.arrayBuffer();
                pType = 0;
            } else {
                fName = outFilename.value.trim() || "secret_table";
                const jsonStr = JSON.stringify(tableData);
                buffer = new TextEncoder().encode(jsonStr).buffer;
                pType = 1;
            }

            if (!pass) return showToast("Password is required.", "error");
            if (mode === 'image' && !carrier) return showToast("Carrier image required for Steganography.", "error");

            showToast("Encrypting payload...", "info");
            try {
                const payload = await multiEncryptPayload(buffer, fName, pass, pType);

                if (mode === 'lsn') {
                    const blob = new Blob([payload], { type: 'application/octet-stream' });
                    downloadFile(blob, `${fName}.lsn`);
                    showToast("Encoded .lsn downloaded.", "success");
                } else {
                    const dataUrl = await embedDataInImage(carrier, payload);
                    const blob = await (await fetch(dataUrl)).blob();
                    downloadFile(blob, `${fName}_stego.png`);
                    showToast("Steganography image downloaded.", "success");
                }
                document.getElementById('encPassword').value = '';
            } catch (e) { showToast(`Error: ${e.message}`, "error"); console.error(e); }
        });

        // Decode State Variables
        let decodedTableData = [];
        let decodedFileName = "";
        let isDecodedTableEditing = false;

        document.getElementById('btnDecode').addEventListener('click', async () => {
            const file = filesData.decFile;
            const pass = document.getElementById('decPassword').value;

            if (!file || !pass) return showToast("File and password required.", "error");

            showToast("Decrypting...", "info");
            try {
                let payload;
                if (file.name.toLowerCase().endsWith('.png') || file.type.startsWith('image/')) {
                    payload = await extractDataFromImage(file);
                } else {
                    payload = new Uint8Array(await file.arrayBuffer());
                }

                const { buffer, fileName, type } = await multiDecryptPayload(payload, pass);
                
                if (type === 0) {
                    // Regular File
                    const blob = new Blob([buffer], { type: 'application/octet-stream' });
                    // Recover extension if it was stripped, or just use the extracted name.
                    // For safety, we use what was embedded.
                    downloadFile(blob, fileName);
                    showToast("File decoded and downloaded.", "success");
                    document.getElementById('decPassword').value = '';
                } else if (type === 1) {
                    // Table JSON
                    const jsonStr = new TextDecoder().decode(buffer);
                    decodedTableData = JSON.parse(jsonStr);
                    decodedFileName = fileName;
                    
                    // Update UI for Table
                    document.getElementById('decInputArea').classList.add('hidden');
                    document.getElementById('decInputArea').classList.remove('flex');
                    document.getElementById('decTableArea').classList.remove('hidden');
                    document.getElementById('decTableArea').classList.add('flex');
                    document.getElementById('decTableFilename').textContent = fileName;
                    
                    isDecodedTableEditing = false;
                    document.getElementById('btnToggleEdit').textContent = "Enable Edit";
                    document.getElementById('btnToggleEdit').classList.replace('bg-blue-500/20', 'bg-white/10');
                    document.getElementById('decTableReEncodeArea').classList.add('hidden');
                    document.getElementById('decTableReEncodeArea').classList.remove('flex');
                    
                    updateCardWidth(true);
                    
                    // We need a specific window scope wrapper for decode table rendering since it mutates a different state array
                    window.renderDecTable = (data, mode) => {
                        const containerId = 'decTableContainer';
                        const container = document.getElementById(containerId);
                        container.innerHTML = '';
                        if(!data || data.length === 0) return;

                        const table = document.createElement('table');
                        table.className = 'secret-table';
                        const numCols = data[0].length;
                        
                        if (mode === 'edit') {
                            const trHead = document.createElement('tr');
                            const thEmpty = document.createElement('th');
                            thEmpty.style.width = '50px';
                            trHead.appendChild(thEmpty);
                            for (let j = 0; j < numCols; j++) {
                                const th = document.createElement('th');
                                th.innerHTML = `
                                    <div class="flex gap-1 justify-center">
                                        <button class="table-ctrl-btn" onclick="moveDecCol(${j}, -1)" ${j===0?'disabled':''}>&lt;</button>
                                        <button class="table-ctrl-btn danger" onclick="delDecCol(${j})">X</button>
                                        <button class="table-ctrl-btn" onclick="moveDecCol(${j}, 1)" ${j===numCols-1?'disabled':''}>&gt;</button>
                                    </div>
                                `;
                                trHead.appendChild(th);
                            }
                            table.appendChild(trHead);
                        }

                        data.forEach((row, i) => {
                            const tr = document.createElement('tr');
                            if (mode === 'edit') {
                                const tdCtrl = document.createElement('td');
                                tdCtrl.innerHTML = `
                                    <div class="flex gap-1 justify-center flex-col sm:flex-row">
                                        <button class="table-ctrl-btn" onclick="moveDecRow(${i}, -1)" ${i===0?'disabled':''}>&uarr;</button>
                                        <button class="table-ctrl-btn danger" onclick="delDecRow(${i})">X</button>
                                        <button class="table-ctrl-btn" onclick="moveDecRow(${i}, 1)" ${i===data.length-1?'disabled':''}>&darr;</button>
                                    </div>
                                `;
                                tr.appendChild(tdCtrl);
                            }
                            row.forEach((cell, j) => {
                                const td = document.createElement('td');
                                const input = document.createElement('input');
                                input.type = 'text';
                                input.className = 'cell-input';
                                input.value = cell;
                                if (mode === 'readonly') input.readOnly = true;
                                else input.addEventListener('input', (e) => { data[i][j] = e.target.value; });
                                td.appendChild(input);
                                tr.appendChild(td);
                            });
                            table.appendChild(tr);
                        });
                        container.appendChild(table);
                    };

                    window.delDecCol = (j) => { if(decodedTableData[0].length > 1) { decodedTableData.forEach(r => r.splice(j, 1)); renderDecTable(decodedTableData, 'edit'); } };
                    window.delDecRow = (i) => { if(decodedTableData.length > 1) { decodedTableData.splice(i, 1); renderDecTable(decodedTableData, 'edit'); } };
                    window.moveDecCol = (j, dir) => {
                        if(j + dir >= 0 && j + dir < decodedTableData[0].length) {
                            decodedTableData.forEach(r => { const temp = r[j]; r[j] = r[j+dir]; r[j+dir] = temp; });
                            renderDecTable(decodedTableData, 'edit');
                        }
                    };
                    window.moveDecRow = (i, dir) => {
                        if(i + dir >= 0 && i + dir < decodedTableData.length) {
                            const temp = decodedTableData[i]; decodedTableData[i] = decodedTableData[i+dir]; decodedTableData[i+dir] = temp;
                            renderDecTable(decodedTableData, 'edit');
                        }
                    };

                    renderDecTable(decodedTableData, 'readonly');
                    showToast("Table decrypted successfully.", "success");
                }
            } catch (e) { showToast(`Decode Failed: ${e.message}`, "error"); console.error(e); }
        });

        // Decode Table Actions
        document.getElementById('btnCloseDecTable').addEventListener('click', resetDecodeView);
        
        document.getElementById('btnToggleEdit').addEventListener('click', (e) => {
            isDecodedTableEditing = !isDecodedTableEditing;
            const btn = e.target;
            const reEncArea = document.getElementById('decTableReEncodeArea');
            
            if (isDecodedTableEditing) {
                btn.textContent = "Lock Editing";
                btn.classList.replace('bg-white/10', 'bg-blue-500/30');
                renderDecTable(decodedTableData, 'edit');
                reEncArea.classList.remove('hidden');
                reEncArea.classList.add('flex');
            } else {
                btn.textContent = "Enable Edit";
                btn.classList.replace('bg-blue-500/30', 'bg-white/10');
                renderDecTable(decodedTableData, 'readonly');
                reEncArea.classList.add('hidden');
                reEncArea.classList.remove('flex');
            }
        });

        document.getElementById('btnReEncode').addEventListener('click', async () => {
            const pass = document.getElementById('reEncPassword').value || document.getElementById('decPassword').value;
            if(!pass) return showToast("Password required to re-encrypt", "error");

            showToast("Re-encrypting table...", "info");
            try {
                const jsonStr = JSON.stringify(decodedTableData);
                const buffer = new TextEncoder().encode(jsonStr).buffer;
                const payload = await multiEncryptPayload(buffer, decodedFileName, pass, 1);
                
                const blob = new Blob([payload], { type: 'application/octet-stream' });
                downloadFile(blob, `${decodedFileName}_updated.lsn`);
                showToast("Table re-encrypted and downloaded.", "success");
                document.getElementById('reEncPassword').value = '';
            } catch (e) {
                showToast(`Error saving: ${e.message}`, "error");
            }
        });

    </script>
