<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSN-ENCODER - Secure File Encryption</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #0d1117; /* Deep space background */
            color: #e2e8f0;
        }

        /* KDE Plasma Breeze Dark Theme Colors */
        :root {
            --breeze-bg: rgba(49, 54, 59, 0.65);
            --breeze-border: rgba(255, 255, 255, 0.1);
            --plasma-accent: #3daee9;
            --plasma-accent-glow: rgba(61, 174, 233, 0.6);
            --plasma-purple: #9b59b6;
            --plasma-purple-glow: rgba(155, 89, 182, 0.6);
        }

        /* Starry Background & Moon */
        #sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: linear-gradient(to bottom, #020111 10%, #20124d 50%, #000022 100%);
        }

        .moon {
            position: absolute;
            top: 15%;
            right: 15%;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            box-shadow: 15px 15px 0 0 #f6f1d3,
                        0 0 40px 10px rgba(246, 241, 211, 0.3);
            transform: rotate(-45deg);
            z-index: -1;
            animation: moonFloat 10s ease-in-out infinite alternate;
        }

        @keyframes moonFloat {
            0% { transform: translateY(0) rotate(-45deg); }
            100% { transform: translateY(-10px) rotate(-40deg); }
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite alternate ease-in-out;
            opacity: 0;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 5px white; }
        }

        /* Glassmorphism KDE Panel */
        .plasma-card {
            background: var(--breeze-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--breeze-border);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                        0 0 30px rgba(61, 174, 233, 0.15);
        }

        /* Custom Input Styling */
        .plasma-input {
            background: rgba(35, 38, 41, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .plasma-input:focus {
            outline: none;
            border-color: var(--plasma-accent);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3), 0 0 8px var(--plasma-accent-glow);
        }

        /* Custom File Input Styling */
        input[type="file"] {
            display: none;
        }
        
        .file-upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 8rem;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.2);
        }
        
        .file-upload-label:hover, .file-upload-label.dragover {
            border-color: var(--plasma-accent);
            background: rgba(61, 174, 233, 0.1);
        }

        /* Gradient Buttons */
        .btn-encrypt {
            background: linear-gradient(135deg, var(--plasma-accent), #2980b9);
            box-shadow: 0 4px 15px rgba(61, 174, 233, 0.4);
            transition: all 0.3s ease;
        }
        .btn-encrypt:hover {
            box-shadow: 0 6px 20px rgba(61, 174, 233, 0.6);
            transform: translateY(-2px);
        }
        
        .btn-decrypt {
            background: linear-gradient(135deg, var(--plasma-purple), #8e44ad);
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.4);
            transition: all 0.3s ease;
        }
        .btn-decrypt:hover {
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.6);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Title Glow */
        .title-glow {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3),
                         0 0 20px var(--plasma-accent),
                         0 0 30px var(--plasma-purple);
        }

        /* Loader */
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--plasma-accent);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .hidden { display: none !important; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div id="sky"></div>
    <div class="moon"></div>

    <div class="w-full max-w-lg p-8 mx-4 rounded-2xl plasma-card relative z-10">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold tracking-wider text-white title-glow mb-2">LSN-ENCODER</h1>
            <p class="text-sm text-gray-300 font-light">Secure AES-256-GCM Client-Side Encryption</p>
        </div>

        <!-- File Upload Area -->
        <div class="mb-6 relative">
            <input type="file" id="fileInput">
            <label for="fileInput" id="dropZone" class="file-upload-label flex-col gap-2">
                <svg class="w-10 h-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
                <span id="fileNameDisplay" class="text-gray-300 text-sm px-4 text-center truncate w-full">
                    Choose a file or drag it here
                </span>
            </label>
        </div>

        <!-- Password Input -->
        <div class="mb-8">
            <label class="block text-xs uppercase tracking-widest text-gray-400 mb-2 font-semibold">Encryption Key (Password)</label>
            <div class="relative">
                <input type="password" id="passwordInput" placeholder="Enter a strong password..." 
                    class="w-full px-4 py-3 rounded-lg plasma-input text-white text-sm placeholder-gray-500 focus:ring-0">
                <button type="button" id="togglePassword" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="eyeIcon">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <button id="btnEncrypt" class="btn btn-encrypt py-3 rounded-lg text-white font-semibold flex items-center justify-center">
                <span class="btn-text">Encrypt (.lsn)</span>
                <div class="loader hidden"></div>
            </button>
            <button id="btnDecrypt" class="btn btn-decrypt py-3 rounded-lg text-white font-semibold flex items-center justify-center">
                <span class="btn-text">Decrypt File</span>
                <div class="loader hidden"></div>
            </button>
        </div>

        <!-- Status Message Box -->
        <div id="statusBox" class="hidden rounded-lg p-4 text-sm text-center font-medium transition-all duration-300">
            <!-- Dynamic Content -->
        </div>

    </div>

    <script>
        // ---------------------------------------------------------
        // UI & Background Setup
        // ---------------------------------------------------------
        const sky = document.getElementById('sky');
        const numStars = 150;

        // Generate CSS Stars
        for (let i = 0; i < numStars; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            
            // Random properties
            const size = Math.random() * 2 + 1; // 1px to 3px
            const x = Math.random() * 100; // 0 to 100 vw
            const y = Math.random() * 100; // 0 to 100 vh
            const duration = Math.random() * 3 + 2; // 2s to 5s
            const delay = Math.random() * 5; // 0s to 5s

            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${x}vw`;
            star.style.top = `${y}vh`;
            star.style.setProperty('--duration', `${duration}s`);
            star.style.animationDelay = `${delay}s`;

            sky.appendChild(star);
        }

        // ---------------------------------------------------------
        // DOM Elements
        // ---------------------------------------------------------
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const passwordInput = document.getElementById('passwordInput');
        const togglePassword = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');
        const btnEncrypt = document.getElementById('btnEncrypt');
        const btnDecrypt = document.getElementById('btnDecrypt');
        const statusBox = document.getElementById('statusBox');

        let selectedFile = null;

        // ---------------------------------------------------------
        // Event Listeners for UI
        // ---------------------------------------------------------
        
        // Password visibility toggle
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            if(type === 'text') {
                eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>`;
            } else {
                eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>`;
            }
        });

        // File selection handling
        const handleFileSelect = (file) => {
            if (file) {
                selectedFile = file;
                fileNameDisplay.textContent = file.name;
                fileNameDisplay.classList.add('text-white');
                statusBox.classList.add('hidden');
            }
        };

        fileInput.addEventListener('change', (e) => handleFileSelect(e.target.files[0]));

        // Drag and Drop implementation
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFileSelect(files[0]);
        });

        // Helper for UI status
        function showStatus(message, type = 'info') {
            statusBox.textContent = message;
            statusBox.className = 'rounded-lg p-4 text-sm text-center font-medium mt-4 transition-all duration-300';
            statusBox.classList.remove('hidden');
            
            if (type === 'error') {
                statusBox.classList.add('bg-red-500/20', 'text-red-400', 'border', 'border-red-500/50');
            } else if (type === 'success') {
                statusBox.classList.add('bg-green-500/20', 'text-green-400', 'border', 'border-green-500/50');
            } else {
                statusBox.classList.add('bg-blue-500/20', 'text-blue-400', 'border', 'border-blue-500/50');
            }
        }

        function setProcessingState(btn, isProcessing) {
            const textSpan = btn.querySelector('.btn-text');
            const loader = btn.querySelector('.loader');
            
            btnEncrypt.disabled = isProcessing;
            btnDecrypt.disabled = isProcessing;
            
            if (isProcessing) {
                textSpan.classList.add('hidden');
                loader.classList.remove('hidden');
            } else {
                textSpan.classList.remove('hidden');
                loader.classList.add('hidden');
            }
        }

        // ---------------------------------------------------------
        // Cryptography Core (AES-GCM 256-bit with PBKDF2)
        // ---------------------------------------------------------
        
        // Convert string password to key material
        async function getPasswordKey(password) {
            const enc = new TextEncoder();
            return window.crypto.subtle.importKey(
                "raw",
                enc.encode(password),
                { name: "PBKDF2" },
                false,
                ["deriveBits", "deriveKey"]
            );
        }

        // Derive AES-GCM key from password material and salt
        async function deriveKey(passwordKey, salt) {
            return window.crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: salt,
                    iterations: 100000,
                    hash: "SHA-256"
                },
                passwordKey,
                { name: "AES-GCM", length: 256 },
                false,
                ["encrypt", "decrypt"]
            );
        }

        // Trigger file download
        function downloadFile(data, filename) {
            const blob = new Blob([data], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 100);
        }

        // ---------------------------------------------------------
        // Encrypt Action
        // ---------------------------------------------------------
        btnEncrypt.addEventListener('click', async () => {
            if (!selectedFile) return showStatus("Please select a file first.", 'error');
            const password = passwordInput.value;
            if (!password) return showStatus("Password is required for encryption.", 'error');

            setProcessingState(btnEncrypt, true);
            statusBox.classList.add('hidden');

            try {
                // Read File
                const fileData = await selectedFile.arrayBuffer();

                // Cryptographic setup
                const salt = window.crypto.getRandomValues(new Uint8Array(16));
                const iv = window.crypto.getRandomValues(new Uint8Array(12));
                const passwordKey = await getPasswordKey(password);
                const aesKey = await deriveKey(passwordKey, salt);

                // Encrypt data
                const encryptedContent = await window.crypto.subtle.encrypt(
                    { name: "AES-GCM", iv: iv },
                    aesKey,
                    fileData
                );

                // Package the file: [Salt (16 bytes)] + [IV (12 bytes)] + [Encrypted Data]
                const encryptedArray = new Uint8Array(encryptedContent);
                const finalPackage = new Uint8Array(salt.length + iv.length + encryptedArray.length);
                
                finalPackage.set(salt, 0);
                finalPackage.set(iv, salt.length);
                finalPackage.set(encryptedArray, salt.length + iv.length);

                // Download
                const newFilename = selectedFile.name + '.lsn';
                downloadFile(finalPackage, newFilename);
                
                showStatus(`File encrypted successfully! Downloaded as ${newFilename}`, 'success');
                passwordInput.value = ''; // Clear password for security

            } catch (error) {
                console.error(error);
                showStatus("Encryption failed. An unexpected error occurred.", 'error');
            } finally {
                setProcessingState(btnEncrypt, false);
            }
        });

        // ---------------------------------------------------------
        // Decrypt Action
        // ---------------------------------------------------------
        btnDecrypt.addEventListener('click', async () => {
            if (!selectedFile) return showStatus("Please select a file to decrypt.", 'error');
            const password = passwordInput.value;
            if (!password) return showStatus("Password is required for decryption.", 'error');

            // Quick check based on extension (UX improvement, not a strict security requirement)
            if (!selectedFile.name.endsWith('.lsn')) {
                // We'll still try, but warn the user it might not be a valid file.
                console.warn("File doesn't have .lsn extension. Attempting decryption anyway...");
            }

            setProcessingState(btnDecrypt, true);
            statusBox.classList.add('hidden');

            try {
                // Read File
                const fileData = await selectedFile.arrayBuffer();
                const packageArray = new Uint8Array(fileData);

                // Ensure file is large enough to contain salt(16) + iv(12) + some data
                if (packageArray.length < 28) {
                    throw new Error("InvalidFile");
                }

                // Extract Salt, IV, and Encrypted Data
                const salt = packageArray.slice(0, 16);
                const iv = packageArray.slice(16, 28);
                const encryptedData = packageArray.slice(28);

                // Cryptographic derivation
                const passwordKey = await getPasswordKey(password);
                const aesKey = await deriveKey(passwordKey, salt);

                // Decrypt
                let decryptedContent;
                try {
                    decryptedContent = await window.crypto.subtle.decrypt(
                        { name: "AES-GCM", iv: iv },
                        aesKey,
                        encryptedData
                    );
                } catch (decryptErr) {
                    // This specific catch block intercepts AES-GCM authentication failures (wrong password/corrupt data)
                    throw new Error("WrongPassword");
                }

                // Download
                // Strip .lsn extension if present, otherwise prepend 'decrypted_'
                let newFilename = selectedFile.name;
                if (newFilename.endsWith('.lsn')) {
                    newFilename = newFilename.slice(0, -4);
                } else {
                    newFilename = 'decrypted_' + newFilename;
                }

                downloadFile(decryptedContent, newFilename);
                
                showStatus(`Success! File unlocked and downloaded as ${newFilename}`, 'success');
                passwordInput.value = ''; // Clear password

            } catch (error) {
                console.error(error);
                if (error.message === "WrongPassword") {
                    showStatus("Decryption failed. Incorrect password or corrupted file.", 'error');
                } else if (error.message === "InvalidFile") {
                    showStatus("Decryption failed. File is not a valid LSN-ENCODER file.", 'error');
                } else {
                    showStatus("Decryption failed due to an unknown error.", 'error');
                }
            } finally {
                setProcessingState(btnDecrypt, false);
            }
        });

    </script>
</body>
</html>
